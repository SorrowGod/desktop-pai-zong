<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠猫咪</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <div id="bubble" class="bubble hidden"></div>
    <div id="chat-window" class="chat-window hidden">
      <div class="chat-header">
        <span class="chat-title">🐱 和猫咪聊天</span>
        <button id="chat-close" class="chat-close">×</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input id="chat-input" type="text" placeholder="和猫咪说点什么..." />
        <button id="chat-send">发送</button>
      </div>
    </div>
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <span>⚙️ 设置</span>
        <button id="settings-close" class="chat-close">×</button>
      </div>
      <div class="settings-body">
        <label>猫咪名字</label>
        <input id="pet-name" type="text" placeholder="给猫咪起个名字" />
        <label>API 地址</label>
        <input id="api-base" type="text" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
        <label>API Key</label>
        <input id="api-key" type="password" placeholder="输入你的 API Key" />
        <label>模型名称</label>
        <input id="model-name" type="text" placeholder="qwen-plus" />
        <label>猫咪大小</label>
        <select id="pet-size">
          <option value="0.8">小</option>
          <option value="1" selected>中</option>
          <option value="1.3">大</option>
        </select>
        <label class="checkbox-label">
          <input id="auto-start" type="checkbox" /> 开机自启动
        </label>
        <button id="settings-save">保存</button>
      </div>
    </div>
    <div id="context-menu" class="context-menu hidden">
      <div class="context-item" data-action="feed">🐟 喂食</div>
      <div class="context-item" data-action="pet">🤚 抚摸</div>
      <div class="context-item" data-action="play">🧶 玩耍</div>
      <div class="context-divider"></div>
      <div class="context-item" data-action="settings">⚙️ 设置</div>
      <div class="context-item" data-action="hide">👁️ 隐藏</div>
      <div class="context-divider"></div>
      <div class="context-item" data-action="exit">🚪 退出</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
