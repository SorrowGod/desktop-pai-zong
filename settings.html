<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面猫咪设置</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-view="settings">
    <div id="settings-panel" class="settings-panel">
      <div class="settings-header">
        <span>⚙️ 设置</span>
        <button id="settings-close" class="chat-close">×</button>
      </div>
      <div class="settings-body">
        <label>猫咪名字</label>
        <input id="pet-name" type="text" placeholder="给猫咪起个名字" />
        <label>API 地址</label>
        <input id="api-base" type="text" placeholder="https://llm-dujne1fkrf6fj1k5.cn-beijing.maas.aliyuncs.com/compatible-mode/v1" />
        <label>API Key</label>
        <input id="api-key" type="password" placeholder="输入你的 API Key" />
        <label>模型名称</label>
        <input id="model-name" type="text" list="model-options" placeholder="qwen3.6-flash" />
        <datalist id="model-options">
          <option value="qwen3.6-flash"></option>
          <option value="qwen-plus"></option>
          <option value="qwen-turbo"></option>
        </datalist>
        <label>猫咪大小</label>
        <select id="pet-size">
          <option value="0.8">小</option>
          <option value="1" selected>中</option>
          <option value="1.3">大</option>
        </select>
        <label class="checkbox-label">
          <input id="auto-start" type="checkbox" /> 开机自启动
        </label>
        <div id="api-test-result" class="api-test-result" aria-live="polite"></div>
        <button id="api-test" type="button">测试 API</button>
        <button id="settings-save" type="button">保存</button>
      </div>
    </div>
    <script type="module" src="/src/panel.js"></script>
  </body>
</html>
